name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all unit and presentation tests
        run: pnpm test

      - name: Typecheck application and pipeline
        run: pnpm typecheck

      - name: Build production dashboard
        run: pnpm build

  privacy-audit:
    name: Public export privacy audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check publication boundary
        run: |
          pnpm export:public "$RUNNER_TEMP/health-dashboard-public"
          pnpm audit:public "$RUNNER_TEMP/health-dashboard-public"
